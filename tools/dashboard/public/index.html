<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Implement dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27%23d98b1c%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-head">
      <span class="live-dot" id="live" title="connection"></span>
      <h1>Implement</h1>
    </div>
    <nav id="runs" class="runs" aria-label="Runs"></nav>
    <p class="side-foot" id="roots"></p>
  </aside>
  <main class="main" id="main">
    <div class="empty" id="empty">
      <p>Pick a run on the left.</p>
      <p class="muted">Runs appear here as soon as a project has a <code>.claude/implement/&lt;slug&gt;/</code> directory.</p>
    </div>
    <section id="run" class="run" hidden></section>
  </main>
</div>
<template id="tpl-run">
  <header class="run-head">
    <div class="run-title">
      <span class="project" data-f="project"></span>
      <h2 data-f="slug"></h2>
    </div>
    <dl class="facts">
      <div><dt>Status</dt><dd data-f="status"></dd></div>
      <div><dt>Size</dt><dd data-f="size"></dd></div>
      <div><dt>Branch</dt><dd class="mono" data-f="branch"></dd></div>
      <div><dt>Started</dt><dd data-f="started"></dd></div>
      <div><dt>Last change</dt><dd data-f="updated"></dd></div>
    </dl>
  </header>
  <section class="track-wrap">
    <div class="rounds" role="tablist" aria-label="Rounds" data-f="rounds" hidden></div>
    <ol class="track" data-f="track"></ol>
    <p class="now" data-f="now"></p>
    <ol class="journal-peek" data-f="peek"></ol>
  </section>
  <div class="columns">
    <section class="col">
      <h3>Agents <span class="count" data-f="agentCount"></span></h3>
      <ol class="agents" data-f="agents"></ol>
    </section>
    <section class="col">
      <h3>Files touched <span class="count" data-f="fileCount"></span>
        <label class="toggle"><input type="checkbox" data-f="showReads"> include reads</label></h3>
      <ol class="files" data-f="files"></ol>
    </section>
  </div>
  <section class="docs">
    <div class="tabs" role="tablist" data-f="tabs"></div>
    <article class="doc" data-f="doc"></article>
  </section>
</template>
</body>
</html>
